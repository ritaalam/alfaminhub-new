openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: Optional AI planning operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai/worksheet-plan:
    post:
      operationId: planWorksheet
      tags: [ai]
      summary: Plan a worksheet from a teacher prompt
      description: >
        Optionally converts a short teacher prompt into a constrained worksheet
        specification patch. This endpoint never receives rendered worksheets,
        images, HTML, PDFs, or saved student data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorksheetPlanningInput"
      responses:
        "200":
          description: A safe AI plan or an explicit local fallback result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorksheetPlanningResult"
        "400":
          description: Invalid planning input
        "429":
          description: Planning rate limit reached
  /ai/chat:
    post:
      operationId: chatWithAlfa
      tags: [ai]
      summary: Chat with Alfa AI
      description: >
        Sends a bounded, teacher-authored conversation to the optional OpenAI
        assistant. Conversation history is held in the browser and is not
        persisted by this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlfaChatInput"
      responses:
        "200":
          description: An AI response or a clear availability message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlfaChatResult"
        "400":
          description: Invalid chat input
        "429":
          description: Chat rate limit reached
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WorksheetPlanningInput:
      type: object
      additionalProperties: false
      required:
        - prompt
        - baseSpec
        - lockedFields
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
        baseSpec:
          $ref: "#/components/schemas/WorksheetPlanningSpec"
        lockedFields:
          type: array
          maxItems: 9
          items:
            type: string
            enum:
              - level
              - duration
              - pages
              - approach
              - skill
              - activityType
              - difficulty
              - theme
              - language
    WorksheetPlanningSpec:
      type: object
      additionalProperties: false
      required:
        - level
        - duration
        - pages
        - approach
        - skill
        - activityType
        - difficulty
        - theme
        - language
      properties:
        level:
          type: string
          maxLength: 80
        duration:
          type: string
          maxLength: 40
        pages:
          type: string
          maxLength: 8
        approach:
          type: string
          maxLength: 80
        skill:
          type: string
          maxLength: 80
        activityType:
          type: string
          maxLength: 80
        difficulty:
          type: string
          maxLength: 80
        theme:
          type: string
          maxLength: 100
        language:
          type: string
          maxLength: 80
    WorksheetPlanningPatch:
      type: object
      additionalProperties: false
      properties:
        level:
          type: string
        duration:
          type: string
        pages:
          type: string
        approach:
          type: string
        skill:
          type: string
        activityType:
          type: string
        difficulty:
          type: string
        theme:
          type: string
        language:
          type: string
    WorksheetPlanningResult:
      type: object
      additionalProperties: false
      required:
        - source
        - patch
      properties:
        source:
          type: string
          enum: [ai, fallback]
        patch:
          $ref: "#/components/schemas/WorksheetPlanningPatch"
        content:
          $ref: "#/components/schemas/AIWorksheetContent"
    AIWorksheetContent:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 140
        teacherNotes:
          type: array
          maxItems: 4
          items:
            type: string
            maxLength: 240
        pages:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [page]
            properties:
              page:
                type: number
                minimum: 1
                maximum: 20
              title:
                type: string
                maxLength: 120
              instruction:
                type: string
                maxLength: 240
    AlfaChatInput:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/AlfaChatMessage"
    AlfaChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 2000
    AlfaChatResult:
      type: object
      additionalProperties: false
      required: [source, message]
      properties:
        source:
          type: string
          enum: [ai, fallback]
        message:
          type: string
          maxLength: 6000

